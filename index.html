<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#152238" />
<title>Облік робіт</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e0920e'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%233a2600'%3E%D0%9E%D0%A0%3C/text%3E%3C/svg%3E" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#152238; --paper:#eef1f6; --surface:#ffffff;
  --line:#d8dfe9; --line-soft:#e8ecf3; --text:#1a2233; --muted:#6a7484;
  --blue:#2560d6; --blue-weak:#e8f0fd; --blue-ink:#123a86;
  --amber:#e0920e; --amber-weak:#fbf1d8; --subtle:#eef2f7;
  --green:#1c9a5f; --red:#d4483b;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
[data-theme="dark"]{
  --paper:#0f1622; --surface:#172231; --line:#2b3849; --line-soft:#222e3e;
  --text:#e7ecf3; --muted:#93a0b2; --ink:#0e1826;
  --blue:#4d88f2; --blue-weak:#1a2c49; --blue-ink:#a9c8ff;
  --amber:#efab34; --amber-weak:#372c12; --green:#36b880; --red:#e56b5d; --subtle:#1f2a3a;
}
[data-theme="dark"] .input,[data-theme="dark"] .select{background:#101a28;color:var(--text);}
[data-theme="dark"] .cabinet,[data-theme="dark"] .mini{background:#101a28;}
[data-theme="dark"] .table th,[data-theme="dark"] .week-card-head{background:#1d2937;}
[data-theme="dark"] .btn-ghost:hover,[data-theme="dark"] .mini:hover,[data-theme="dark"] .icon-btn:hover{background:#1e2a39;}
[data-theme="dark"] .total-box{background:#12202f;}
[data-theme="dark"] .setup-steps code{background:#1d2937;color:#cfe0ff;}
[data-theme="dark"] .draw-thumb{background:#1b2736;background-image:linear-gradient(rgba(120,160,240,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,240,.10) 1px,transparent 1px);background-size:16px 16px;}
[data-theme="dark"] .cabinet:hover{background:#1a2c49;}
[data-theme="dark"] .cabinet.admin{background:#2a2412;}
[data-theme="dark"] .cabinet.admin:hover{background:#332a15;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.loading{color:var(--muted);font-size:15px;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);} .small{font-size:12.5px;} .strong{font-weight:600;}
.nowrap{white-space:nowrap;} .grow{flex:1 1 auto;min-width:0;}
.row{display:flex;align-items:center;} .gap8{gap:8px;} .end{justify-content:flex-end;}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
  background:var(--ink);color:#fff;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:22px 22px;border-bottom:2px solid var(--amber);}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0;}
.topbar-title{display:flex;flex-direction:column;min-width:0;}
.tt-main{font-weight:700;letter-spacing:.3px;}
.tt-sub{font-size:12px;color:#aeb9cc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.brand-mark{width:40px;height:40px;border-radius:9px;background:var(--amber);color:#3a2600;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
.brand-mark.sm{width:34px;height:34px;font-size:13px;border-radius:8px;}
.sync{font-size:11px;color:#9fe3c0;display:flex;align-items:center;gap:5px;}
.sync.demo{color:#e6c98a;}
.demo-banner{background:var(--amber-weak);border:1px solid var(--amber);color:var(--text);border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.4;margin-bottom:14px;}
.sync .dotlive{width:7px;height:7px;border-radius:50%;background:#39d98a;box-shadow:0 0 0 0 rgba(57,217,138,.6);animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(57,217,138,.5)}70%{box-shadow:0 0 0 6px rgba(57,217,138,0)}100%{box-shadow:0 0 0 0 rgba(57,217,138,0)}}

.tabs{position:sticky;top:56px;z-index:15;display:flex;gap:2px;overflow-x:auto;background:var(--surface);padding:0 8px;border-bottom:1px solid var(--line);scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;border:none;background:none;padding:12px 14px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;font-weight:500;white-space:nowrap;font-family:inherit;}
.tab:hover{color:var(--text);}
.tab-active{color:var(--blue-ink);border-bottom-color:var(--blue);font-weight:600;}
.monthbar{position:sticky;top:99px;z-index:14;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line-soft);}
.month-label{font-weight:600;min-width:130px;text-align:center;text-transform:capitalize;}
.content{max-width:1800px;margin:0 auto;padding:18px 24px 70px;}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.h2{font-size:19px;font-weight:700;margin:0 0 2px;letter-spacing:-.2px;}

.btn{border:1px solid transparent;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;}
.btn.sm{padding:6px 11px;font-size:12.5px;}
.btn-primary{background:var(--blue);color:#fff;} .btn-primary:hover{background:#1c50bb;}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--line);} .btn-ghost:hover{background:#f4f6fa;}
.topbar .btn-ghost{background:transparent;color:#cdd7e6;border-color:rgba(255,255,255,.25);}
.topbar .btn-ghost:hover{background:rgba(255,255,255,.12);}
.btn-block{width:100%;} .btn.disabled{opacity:.6;pointer-events:none;}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.icon-btn:hover{background:#f4f6fa;}
.topbar .icon-btn{border-color:rgba(255,255,255,.22);color:#dbe3ef;background:transparent;}
.topbar .icon-btn:hover{background:rgba(255,255,255,.12);}

.input,.select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:16px;font-family:inherit;background:#fff;color:var(--text);}
.input:focus,.select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-weak);}
.textarea{resize:vertical;line-height:1.5;}
.field{display:flex;flex-direction:column;gap:5px;}
.field>span{font-size:12.5px;color:var(--muted);font-weight:600;}
.pin-input{text-align:center;font-size:22px;letter-spacing:8px;font-family:var(--mono);}
.pin-sm{max-width:90px;text-align:center;font-family:var(--mono);}
.file-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;}

.auth-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 12px 40px rgba(21,34,56,.12);}
.auth-card{position:relative;}
.theme-fab{position:absolute;top:14px;right:14px;}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.brand-title{font-size:19px;font-weight:800;letter-spacing:-.3px;}
.brand-sub{font-size:12.5px;color:var(--muted);}
.cabinet-list{display:flex;flex-direction:column;gap:9px;}
.cabinet{display:flex;align-items:center;gap:13px;text-align:left;width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-family:inherit;transition:.12s;}
.cabinet:hover{border-color:var(--blue);background:var(--blue-weak);}
.cabinet.admin{border-color:var(--amber);background:var(--amber-weak);} .cabinet.admin:hover{background:#f8ead0;}
.cabinet-ava{width:42px;height:42px;border-radius:11px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:0 0 auto;}
.admin-ava{background:var(--amber);color:#3a2600;}
.cabinet-name{font-weight:700;font-size:15px;} .cabinet-role{font-size:12.5px;color:var(--muted);}
.cabinet-info{flex:1 1 auto;min-width:0;} .lock{font-size:15px;opacity:.6;}
.login-card{max-width:480px;}
.cab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.cab-tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 8px 15px;display:flex;flex-direction:column;align-items:center;gap:11px;min-height:118px;cursor:pointer;font-family:inherit;color:var(--text);transition:transform .12s,box-shadow .12s,border-color .12s,background .12s;}
.cab-tile:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,40,90,.13);}
.cab-tile.admin:hover{border-color:var(--amber);}
.cab-tile.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-weak);background:var(--blue-weak);}
.cab-tile.admin.sel{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-weak);background:var(--amber-weak);}
.cab-ico{width:46px;height:46px;border-radius:13px;background:var(--subtle);color:var(--muted);display:flex;align-items:center;justify-content:center;transition:.12s;}
.cab-ico.amber{background:var(--amber-weak);color:var(--amber);}
.cab-tile.sel .cab-ico{color:var(--blue);}
.cab-tile.admin.sel .cab-ico{color:var(--amber);}
.cab-ico svg{width:24px;height:24px;}
.cab-label{font-weight:600;font-size:12.5px;line-height:1.25;text-align:center;}
.cab-lock{position:absolute;top:9px;right:10px;font-size:11px;opacity:.5;}
.cab-check{position:absolute;top:7px;left:9px;width:17px;height:17px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.cab-tile.admin.sel .cab-check{background:var(--amber);color:#3a2600;}
.login-go{margin-top:18px;font-size:15px;padding:12px;}
.login-go.disabled{background:var(--subtle);color:var(--muted);opacity:1;pointer-events:none;}
.err-text{color:var(--red);font-size:13px;margin-top:8px;font-weight:600;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;}
.add-card{margin-bottom:16px;}
.clock{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--text);white-space:nowrap;letter-spacing:.2px;background:var(--surface);border:1px solid var(--line);padding:6px 11px;border-radius:999px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{display:inline-block;padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--surface);}
.badge{font-weight:700;font-size:13px;}
.badge.on{color:#16a34a;}
.badge.off{color:var(--muted);}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.card-h{font-weight:700;font-size:15px;margin-bottom:12px;}
.switch-list{display:flex;flex-direction:column;}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
.switch-row:last-child{border-bottom:none;}
.switch-row input{width:20px;height:20px;cursor:pointer;flex:0 0 auto;}
@media(max-width:720px){.cards2{grid-template-columns:1fr;}}
@media(max-width:640px){.clock{display:none;}}
.stat-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.stat{flex:1 1 120px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;}
.stat-val{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.1;}
.stat-lbl{font-size:11.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.4px;}

.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.filters .select{max-width:200px;width:auto;flex:1 1 150px;}
.form-inline{display:flex;gap:8px;align-items:center;}
.form-inline.wrap{flex-wrap:wrap;}
.form-inline .select{width:auto;flex:0 1 190px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.form-grid .full{grid-column:1 / -1;}
.total-box{border:1px dashed var(--line);border-radius:9px;padding:9px 11px;background:#f7f9fc;font-weight:700;color:var(--blue-ink);}

.center{text-align:center;}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:5px 0;cursor:pointer;}
.chk input{width:16px;height:16px;flex:0 0 auto;}
.chk-list{display:flex;flex-direction:column;gap:2px;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-top:5px;}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);}
.table{width:100%;border-collapse:collapse;font-size:13.5px;}
.table th{text-align:left;padding:11px 12px;background:#f6f8fb;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);white-space:nowrap;}
.table td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
.table tr:last-child td{border-bottom:none;}
.table .num{text-align:right;}
.table.compact td{padding:7px 10px;} .table.compact{font-size:13px;}
.note-cell{color:var(--muted);max-width:200px;} .actions-cell{white-space:nowrap;text-align:right;}
.mini{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:13px;margin-left:4px;color:var(--muted);font-family:inherit;}
.mini:hover{background:#f2f5f9;color:var(--text);}
.mini.danger:hover{background:#fdecea;color:var(--red);border-color:#f3c3bd;}

.week-list{display:flex;flex-direction:column;gap:12px;}
.week-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.week-card-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:#f6f8fb;border-bottom:1px solid var(--line);}
.wc-name{font-weight:700;} .wc-totals{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--blue-ink);font-weight:600;}
.dot{color:var(--muted);}

.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;}
.chart-title{font-weight:700;font-size:14px;} .chart-sub{font-size:11.5px;color:var(--muted);margin:1px 0 8px;}
.chart-full{grid-column:1 / -1;} .chart-box{position:relative;height:240px;}

.draw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
.draw-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.draw-thumb{width:100%;height:110px;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:inherit;background:linear-gradient(135deg,#eef2f8,#dbe4f0);background-image:linear-gradient(rgba(37,96,214,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(37,96,214,.06) 1px,transparent 1px);background-size:16px 16px;}
.draw-ico{font-size:30px;} .draw-open{font-size:12px;color:var(--blue-ink);font-weight:600;}
.draw-meta{padding:10px 12px;} .draw-name{font-weight:600;font-size:13.5px;} .draw-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.draw-del{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);}
.route-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.route-card{display:flex;flex-direction:column;gap:10px;padding:14px;position:relative;}
.draw-row{display:flex;align-items:flex-start;gap:12px;}
.draw-thumb.sm{width:64px;height:64px;flex:0 0 auto;}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;}
.route-arrow{opacity:.5;}
.route-now{color:var(--blue-ink);font-weight:700;}
.draw-actions{display:flex;flex-direction:column;gap:8px;}
.pass-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.select.sm,.btn.sm{font-size:13px;padding:7px 12px;}
.mt6{margin-top:6px;}
.board-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.date-nav{display:flex;align-items:center;gap:6px;}
.date-nav .input{width:auto;}
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.emp-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;}
.emp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;}
.emp-name{font-weight:700;}
.emp-sum{color:var(--muted);font-size:13px;white-space:nowrap;}
.day-lines{display:flex;flex-direction:column;gap:8px;}
.day-line{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;flex-wrap:wrap;}
.day-line-main{flex:1;min-width:120px;}
.day-line-nums{color:var(--muted);white-space:nowrap;}
.day-line-act{display:flex;gap:4px;}
.mt8{margin-top:8px;}
.measure{display:flex;gap:6px;}
.measure .input{flex:1;min-width:0;}
.unit-sel{width:auto;flex:0 0 auto;min-width:64px;}
.draw-full{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);}

.notes-list{display:flex;flex-direction:column;gap:10px;}
.note-item{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:12px 14px;}
.note-text{white-space:pre-wrap;} .note-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}

.export-card{max-width:460px;}
.export-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-soft);}
.export-row:last-of-type{border-bottom:none;}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;color:var(--muted);}
.empty.small{padding:16px;}
.setup-steps{text-align:left;margin:14px 0;padding-left:20px;line-height:1.7;}
.setup-steps code{background:#eef1f6;padding:1px 6px;border-radius:5px;font-family:var(--mono);font-size:12.5px;}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,40,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;z-index:60;overflow-y:auto;}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin-top:24px;}
.modal-wide{max-width:640px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);}
.modal-title{font-size:16px;font-weight:700;margin:0;}
.modal-body{padding:18px;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:10px;color:#fff;font-size:13.5px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;}
.toast-ok{background:var(--green);} .toast-error{background:var(--red);}

@media(max-width:680px){ .charts-grid{grid-template-columns:1fr;} }
@media(max-width:560px){
  .form-grid{grid-template-columns:1fr;}
  .form-inline{flex-wrap:wrap;}
  .form-inline .select,.form-inline .grow{flex:1 1 100%;}
  .stat{flex:1 1 100%;}
  .tt-sub{max-width:150px;}
  .filters .select{flex:1 1 100%;max-width:none;}
  .tabs{top:56px;} .monthbar{top:99px;}
}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="loading">Завантаження…</div></div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

function isoDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),da=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${da}`; }
const todayStr = () => isoDate(new Date());
function parseDate(s){ const p=String(s).split("-").map(Number); return new Date(p[0],(p[1]||1)-1,p[2]||1); }

function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function shiftMonth(ym,delta){ const p=ym.split("-").map(Number); const d=new Date(p[0],p[1]-1+delta,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
const MONTHS_RU=["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"];
function monthLabel(ym){ const p=ym.split("-").map(Number); return `${MONTHS_RU[p[1]-1]} ${p[0]}`; }
function fmtMinutes(min){ const t=Math.max(0,Math.round(min||0)),h=Math.floor(t/60),m=t%60; if(h&&m)return `${h} год ${m} хв`; if(h)return `${h} год`; return `${m} хв`; }
const num=(v)=>{ const n=parseFloat(v); return isFinite(n)?n:0; };

function compressImage(file, maxSide=1200, quality=0.62){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("read"));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("img"));
      img.onload=()=>{
        let{width,height}=img;
        if(width>maxSide||height>maxSide){ const r=Math.min(maxSide/width,maxSide/height); width=Math.round(width*r); height=Math.round(height*r); }
        const c=document.createElement("canvas"); c.width=width; c.height=height;
        const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,width,height); ctx.drawImage(img,0,0,width,height);
        resolve(c.toDataURL("image/jpeg",quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function defaultFields(){ return [
  {id:"unit", label:"Одиниця виміру", type:"select", unit:"", options:["шт","кг","м","м²","компл."], scope:"all", showInTable:false, sumInReports:false},

  {id:"material", label:"Витрата матеріалу", type:"measure", unit:"", options:["м","кг"], scope:"all", showInTable:true, sumInReports:false},
  {id:"mat", label:"Матеріал", type:"select", unit:"", options:["Сталь","Алюміній","Нержавійка","ПШ","Пластик","Мідь"], scope:"all", showInTable:true, sumInReports:false},

  {id:"size", label:"Розмір", type:"text", unit:"", options:[], scope:"all", showInTable:true, sumInReports:false},
  {id:"defect", label:"Брак", type:"number", unit:"шт", options:[], scope:"all", showInTable:true, sumInReports:true}
]; }
function defaultMeta(){ return { admin:{name:"Керуючий",pin:""}, managers:[], departments:[], employees:[], notes:[], drawings:[], orders:[], fields:defaultFields(), settings:{features:{week:true,reports:true,orders:true,fields:true,drawings:true,notes:true}} }; }
function migrate(m){
  ["managers","departments","employees","notes","drawings","orders"].forEach(k=>{ if(!Array.isArray(m[k])) m[k]=[]; });
  if(!Array.isArray(m.fields)) m.fields=defaultFields();
  m.departments.forEach(d=>{ if(!Array.isArray(d.managerIds)) d.managerIds = d.managerId?[d.managerId]:[]; });
  m.managers.forEach(mg=>{ if(!mg.perms) mg.perms={ employees:true, editRecords:true, export:true }; });
  m.settings = m.settings || {};
  m.settings.features = Object.assign({week:true,reports:true,orders:true,fields:true,drawings:true,notes:true}, m.settings.features||{});
  (m.fields||[]).forEach(fl=>{ if(fl.id==="material" && fl.type!=="measure"){ fl.type="measure"; if(!Array.isArray(fl.options)||!fl.options.length) fl.options=["м","кг"]; else if(fl.options.indexOf("кг")<0) fl.options.push("кг"); fl.unit=""; fl.sumInReports=false; } });
  if(!m.settings.seededMatProfile){
    const ensure=(fld)=>{ if(!m.fields.some(x=>x.id===fld.id)) m.fields.push(fld); };
    ensure({id:"mat",label:"Матеріал",type:"select",unit:"",options:["Сталь","Алюміній","Нержавійка","ПШ","Пластик","Мідь"],scope:"all",showInTable:true,sumInReports:false});
    ensure({id:"profile",label:"Профіль",type:"select",unit:"",options:["Труба","Круг","Квадрат","Шестигранник"],scope:"all",showInTable:true,sumInReports:false});
    m.settings.seededMatProfile=true;
  }
  if(!m.settings.seededDim){
    const ensure2=(fld)=>{ if(!m.fields.some(x=>x.id===fld.id)) m.fields.push(fld); };
    ensure2({id:"diam",label:"Діаметр",type:"number",unit:"мм",options:[],scope:"all",showInTable:true,sumInReports:false});
    ensure2({id:"size",label:"Розмір",type:"text",unit:"",options:[],scope:"all",showInTable:true,sumInReports:false});
    m.settings.seededDim=true;
  }
  const firstDep=(m.departments[0]&&m.departments[0].id)||"";
  m.drawings.forEach(d=>{ if(d.currentDept===undefined){ d.currentDept=(d.departmentId&&d.departmentId!=="all")?d.departmentId:firstDep; } if(!d.status) d.status="waiting"; if(d.finished===undefined) d.finished=false; if(!Array.isArray(d.history)) d.history=d.currentDept?[{deptId:d.currentDept,at:d.createdAt||todayStr()}]:[]; if(d.isImage===undefined) d.isImage=true; if(!d.fileName) d.fileName=(d.name||"креслення")+".jpg"; });
}

async function startFirebase(){
  try{
    const appMod=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const authMod=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    const fsMod=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    fb.doc=fsMod.doc; fb.getDoc=fsMod.getDoc; fb.setDoc=fsMod.setDoc; fb.updateDoc=fsMod.updateDoc; fb.deleteDoc=fsMod.deleteDoc; fb.collection=fsMod.collection; fb.addDoc=fsMod.addDoc; fb.onSnapshot=fsMod.onSnapshot;
    const fbApp=appMod.initializeApp(firebaseConfig);
    auth=authMod.getAuth(fbApp); db=fsMod.getFirestore(fbApp); mode="cloud";
    authMod.onAuthStateChanged(auth,(user)=>{ if(user) subscribe(); });
    authMod.signInAnonymously(auth).catch(()=>{ showFatal("Firebase відхилив вхід. Увімкніть спосіб входу «Анонімний» у розділі Authentication (див. README)."); });
  }catch(e){ showFatal("Не вдалося підключитися до Firebase. Перевірте налаштування у файлі index.html та підключення до інтернету."); }
}

function subscribe(){
  const metaRef = fb.doc(db,"app","meta");
  fb.onSnapshot(metaRef, async (snap)=>{
    if(!snap.exists()){ try{ await fb.setDoc(metaRef, defaultMeta()); }catch(e){} return; }
    state.meta = snap.data();
    migrate(state.meta);
    loadSession(); state.ready=true; render();
  }, (err)=>{ showFatal("Немає доступу до бази даних. Перевірте правила Firestore (див. README)."); });
  fb.onSnapshot(fb.collection(db,"records"), (qs)=>{
    const arr=[]; qs.forEach(d=> arr.push({ id:d.id, ...d.data() }));
    state.records = arr; if(state.ready) render();
  }, (err)=>{});
}
function startLocal(){
  mode="local";
  try{ const mm=localStorage.getItem(LS_META); state.meta = mm?JSON.parse(mm):defaultMeta(); }catch(e){ state.meta=defaultMeta(); }
  migrate(state.meta);
  try{ const rr=localStorage.getItem(LS_RECS); state.records = rr?JSON.parse(rr):[]; }catch(e){ state.records=[]; }
  loadSession(); state.ready=true; render();
}
function saveLocalRecords(){ if(LS_OK) try{ localStorage.setItem(LS_RECS, JSON.stringify(state.records)); }catch(e){} }

// запись всей meta (низкочастотные изменения)
async function saveMeta(mutator){
  const next = JSON.parse(JSON.stringify(state.meta));
  mutator(next); state.meta = next; render();
  if(mode==="cloud"){ try{ await fb.setDoc(fb.doc(db,"app","meta"), next); }catch(e){ toast("error","Не вдалося зберегти. Перевірте інтернет."); } }
  else { if(LS_OK) try{ localStorage.setItem(LS_META, JSON.stringify(next)); }catch(e){} }
}
async function addRecord(rec){
  if(mode==="cloud"){ try{ await fb.addDoc(fb.collection(db,"records"), rec); }catch(e){ toast("error","Не вдалося додати запис."); } }
  else { state.records.push({ ...rec, id:uid() }); saveLocalRecords(); render(); }
}
async function editRecord(id, rec){
  if(mode==="cloud"){ try{ await fb.updateDoc(fb.doc(db,"records",id), rec); }catch(e){ toast("error","Не вдалося змінити запис."); } }
  else { const i=state.records.findIndex(x=>x.id===id); if(i>=0) state.records[i]={ ...state.records[i], ...rec }; saveLocalRecords(); render(); }
}
async function removeRecord(id){
  if(mode==="cloud"){ try{ await fb.deleteDoc(fb.doc(db,"records",id)); }catch(e){ toast("error","Не вдалося видалити запис."); } }
  else { state.records=state.records.filter(x=>x.id!==id); saveLocalRecords(); render(); }
}

function customInput(fl,f){
  const val = (f&&f.custom&&f.custom[fl.id]!=null)?f.custom[fl.id]:"";
  const lbl = esc(fl.label)+((fl.unit&&fl.type!=="measure")?` (${esc(fl.unit)})`:"");
  let inp;
  if(fl.type==="select"){ inp=`<select class="select" id="rc-cf-${fl.id}"><option value="">—</option>${(fl.options||[]).map(o=>`<option value="${esc(o)}" ${String(val)===String(o)?"selected":""}>${esc(o)}</option>`).join("")}</select>`; }
  else if(fl.type==="measure"){ const uval=(f&&f.custom&&f.custom[fl.id+"__u"])||((fl.options||[])[0]||""); const uo=(fl.options||[]).map(o=>`<option value="${esc(o)}" ${String(uval)===String(o)?"selected":""}>${esc(o)}</option>`).join(""); inp=`<div class="measure"><input type="number" class="input" id="rc-cf-${fl.id}" value="${esc(val)}" /><select class="select unit-sel" id="rc-cfu-${fl.id}">${uo}</select></div>`; }
  else if(fl.type==="number"){ inp=`<input type="number" class="input" id="rc-cf-${fl.id}"${(fl.id==="cut"||fl.id==="defect")?' data-action="rc-calc"':''} value="${esc(val)}" />`; }
  else { inp=`<input class="input" id="rc-cf-${fl.id}" value="${esc(val)}" />`; }
  return `<label class="field"><span>${lbl}</span>${inp}</label>`;
}
function customFieldsHTML(deptId,f){ if(!deptId) return ""; return fieldsFor(deptId).map(fl=>customInput(fl,f)).join(""); }

let pendingRender=false;
function render(){
  const ae=document.activeElement;
  if(ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA") && ae.dataset.live==="1"){ pendingRender=true; return; }
  _render();
}
document.addEventListener("focusout",()=>{ if(pendingRender){ pendingRender=false; setTimeout(render,60); } });

function _render(){
  if(!state.ready || !state.meta){ app.innerHTML = `<div class="center"><div class="loading">Підключення до бази…</div></div>`; return; }
  if(!state.meta.admin || !state.meta.admin.setup){ app.innerHTML = setupAdminHTML(); return; }
  if(!state.session){ app.innerHTML = loginHTML(); return; }
  app.innerHTML = workspaceHTML();
  if(state.view==="reports") initReportCharts();
}

function loginHTML(){
  const m=M();
  const pick=state.loginPick;
  const sel=(role,id)=> !!pick && pick.role===role && (role==="admin" || pick.managerId===id);

function monthRecords(){
  const vis=visibleDeptIdSet();
  return state.records
    .filter(r=>vis.has(r.departmentId) && monthOf(r.date)===state.month)
    .filter(r=>state.filterDept==="all"||r.departmentId===state.filterDept)
    .filter(r=>state.filterEmp==="all"||r.employeeId===state.filterEmp)
    .filter(r=>{ if(!state.search)return true; const q=state.search.toLowerCase(); return (r.task||"").toLowerCase().includes(q)||empName(r.employeeId).toLowerCase().includes(q); })
    .sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
}

function weekHTML(){
  const ws=state.weekStart, we=addDays(ws,6), vis=visibleDeptIdSet();
  const recs=state.records.filter(r=>{ if(!vis.has(r.departmentId))return false; const d=parseDate(r.date); return d>=ws&&d<=we; });
  const byEmp={}; recs.forEach(r=>{(byEmp[r.employeeId]=byEmp[r.employeeId]||[]).push(r);});
  const emps=Object.keys(byEmp).sort((a,b)=>empName(a).localeCompare(empName(b)));
  const totalMin=recs.reduce((s,r)=>s+recTotalMin(r),0);
  const cards=emps.map(eid=>{
    const list=byEmp[eid].sort((a,b)=>a.date<b.date?-1:1);
    const eMin=list.reduce((s,r)=>s+recTotalMin(r),0);
    const eQty=list.reduce((s,r)=>s+num(r.qty),0);
    const rows=list.map(r=>`<tr><td class="mono nowrap muted">${esc(r.date.slice(5))}</td><td>${esc(r.task)}</td><td class="muted small nowrap">${esc(deptName(r.departmentId))}</td><td class="num mono">${esc(r.qty)} шт</td><td class="num mono">${fmtMinutes(recTotalMin(r))}</td></tr>`).join("");
    return `<div class="week-card"><div class="week-card-head"><div class="wc-name">${esc(empName(eid))}</div><div class="wc-totals"><span class="mono">${eQty} шт</span><span class="dot">·</span><span class="mono">${fmtMinutes(eMin)}</span></div></div><table class="table compact"><tbody>${rows}</tbody></table></div>`;
  }).join("");
  return `
    <div class="section-head">
      <div><h2 class="h2">Що робили за тиждень</h2><div class="muted small">${isoDate(ws)} — ${isoDate(we)}</div></div>
      <div class="row gap8"><button class="icon-btn" data-action="week" data-d="-7">‹</button><button class="btn btn-ghost sm" data-action="week-now">Цей тиждень</button><button class="icon-btn" data-action="week" data-d="7">›</button></div>

      <div class="stat"><div class="stat-val">${emps.length}</div><div class="stat-lbl">працівників працювало</div></div>
      <div class="stat"><div class="stat-val">${recs.length}</div><div class="stat-lbl">записів</div></div>
      <div class="stat"><div class="stat-val mono">${fmtMinutes(totalMin)}</div><div class="stat-lbl">сумарно</div></div>
    </div>
    ${emps.length===0?'<div class="empty">За цей тиждень записів немає.</div>':`<div class="week-list">${cards}</div>`}`;
}

function initReportCharts(){
  chartRegistry.forEach(c=>{ try{c.destroy();}catch(e){} }); chartRegistry=[];
  if(!reportData || typeof Chart==="undefined") return;
  const baseBar=(canvasId,labels,data,color,unit)=>{
    const el=$(canvasId); if(!el)return;
    chartRegistry.push(new Chart(el,{type:"bar",data:{labels,datasets:[{data,backgroundColor:color,borderRadius:4}]},
      options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>` ${c.parsed.x} ${unit}`}}},scales:{x:{ticks:{precision:0}}}}}));
  };
  baseBar("ch-empqty", reportData.empQty.map(x=>x.name), reportData.empQty.map(x=>x.qty), "#2560d6", "шт");
  baseBar("ch-emptime", reportData.empTime.map(x=>x.name), reportData.empTime.map(x=>x.hours), "#e0920e", "год");
  baseBar("ch-dept", reportData.dept.map(x=>x.name), reportData.dept.map(x=>x.hours), "#1c9a5f", "год");
  baseBar("ch-tasks", reportData.tasks.map(x=>x.name), reportData.tasks.map(x=>x.qty), "#152238", "шт");
  const el=$("ch-day");
  if(el) chartRegistry.push(new Chart(el,{type:"line",data:{labels:reportData.day.map(x=>x.day),datasets:[{data:reportData.day.map(x=>x.qty),borderColor:"#2560d6",backgroundColor:"rgba(37,96,214,.12)",fill:true,tension:.3,pointRadius:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:(c)=>"День "+c[0].label,label:(c)=>` ${c.parsed.y} шт`}}},scales:{y:{ticks:{precision:0}}}}}));
}

// ---------- Креслення ----------
function drawingsHTML(){
  const admin=isAdmin(), vis=visibleDeptIdSet();
  const list=M().drawings.filter(d=> admin || vis.has(d.currentDept));
  const depts=M().departments;
  const uploader = admin ? `<div class="card add-card"><div class="form-inline wrap">
      <input class="input grow" id="draw-name" data-live="1" placeholder="Назва креслення" />
      <select class="select" id="draw-target"><option value="">Стартова дільниця…</option>${depts.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join("")}</select>
      <input type="file" class="file-input" id="draw-file" data-action="draw-file" />
      <label for="draw-file" class="btn btn-primary" id="draw-btn">Обрати файл</label>
    </div><div class="muted small mt8">Формати: зображення, PDF, DXF, DWG, STEP, IGES, ZIP, RAR тощо (до ~0.9 МБ). Оберіть стартову дільницю — далі креслення передаватиметься по маршруту.</div></div>` : "";
  const statusBadge=(d)=> d.finished?'<span class="badge on">✓ Маршрут завершено</span>':(d.status==="in_work"?'<span class="badge" style="color:var(--blue-ink)">● В роботі</span>':'<span class="badge off">○ Очікує приймання</span>');
  const routeTrail=(d)=>{ const names=(d.history||[]).map(h=>esc(deptName(h.deptId))); if(!names.length) return ""; return `<div class="route">${names.map((n,i)=>`${i?'<span class="route-arrow">→</span>':''}<span class="${i===names.length-1&&!d.finished?'route-now':''}">${n}</span>`).join("")}</div>`; };
  const otherDepts=(cur)=> depts.filter(x=>x.id!==cur);
  const cards=list.map(d=>{
    const canAct = !d.finished && (admin || vis.has(d.currentDept));
    let actions="";
    if(!d.finished && canAct){
      if(d.status==="waiting"){
        actions=`<button class="btn btn-primary sm" data-action="draw-accept" data-id="${d.id}">Прийняти в роботу</button>`;
      } else {
        actions=`<div class="pass-row"><select class="select sm" id="pass-${d.id}"><option value="">Наступна дільниця…</option>${otherDepts(d.currentDept).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><button class="btn btn-ghost sm" data-action="draw-pass" data-id="${d.id}">Передати далі →</button></div>
          <button class="btn btn-ghost sm" data-action="draw-finish" data-id="${d.id}">Завершити маршрут ✓</button>`;
      }
    }
    return `<div class="draw-card route-card">
      <div class="draw-row">
        <button class="draw-thumb sm" data-action="draw-open" data-id="${d.id}"><span class="draw-ico">${(d.isImage||/(png|jpe?g|webp|gif)$/i.test(d.fileName||""))?"🖼":"📄"}</span><span class="draw-open">${(d.isImage||/(png|jpe?g|webp|gif)$/i.test(d.fileName||""))?"Відкрити":"Завантажити"}</span></button>
        <div class="draw-meta">
          <div class="draw-name">${esc(d.name)}</div>
          <div class="draw-sub">Зараз на: <b>${esc(deptName(d.currentDept))||"—"}</b> · ${esc(d.createdAt)}${d.fileName&&d.fileName.indexOf(".")>=0?` · ${esc(d.fileName.split(".").pop().toUpperCase())}`:""}</div>
          <div class="mt6">${statusBadge(d)}</div>
        </div>
        ${admin?`<button class="mini danger draw-del" data-action="draw-del" data-id="${d.id}">✕</button>`:""}
      </div>
      ${routeTrail(d)}
      ${actions?`<div class="draw-actions">${actions}</div>`:""}
    </div>`;
  }).join("");
  return `<h2 class="h2">Креслення · маршрут</h2><div class="muted small mb12">${admin?"Завантажте креслення і оберіть стартову дільницю. Керівники прийматимуть його в роботу та передаватимуть далі по дільницях.":"Креслення на ваших дільницях. Прийміть у роботу та передайте далі, коли готово."}</div>
    ${uploader}${list.length===0?'<div class="empty">Креслень поки немає.</div>':`<div class="route-grid">${cards}</div>`}`;
}

function openDeptModal(id){
  const d=M().departments.find(x=>x.id===id); if(!d) return;
  const checks=M().managers.map(m=>`<label class="chk"><input type="checkbox" class="dept-mgr-chk" value="${m.id}" ${(d.managerIds||[]).includes(m.id)?"checked":""}/> ${esc(m.name)}</label>`).join("")||'<div class="muted small">Керівників ще немає.</div>';
  $("modal-root").innerHTML=`<div class="modal-overlay" data-action="modal-bg"><div class="modal">
    <div class="modal-head"><h3 class="modal-title">Дільниця</h3><button class="icon-btn" data-action="modal-close">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="dm-id" value="${esc(d.id)}"/>
      <label class="field mb12"><span>Назва</span><input class="input" id="dm-name" value="${esc(d.name)}"/></label>
      <div class="field"><span>Керівники (доступ до дільниці)</span><div class="chk-list">${checks}</div></div>
      <div class="row gap8 mt16 end"><button class="btn btn-ghost" data-action="modal-close">Скасувати</button><button class="btn btn-primary" data-action="dept-save">Зберегти</button></div>
    </div></div></div>`;
}
function openManagerModal(id){
  const m=M().managers.find(x=>x.id===id); if(!m) return; const p=m.perms||{};
  $("modal-root").innerHTML=`<div class="modal-overlay" data-action="modal-bg"><div class="modal">
    <div class="modal-head"><h3 class="modal-title">Керівник</h3><button class="icon-btn" data-action="modal-close">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="mm-id" value="${esc(m.id)}"/>
      <label class="field mb12"><span>Ім'я</span><input class="input" id="mm-name" value="${esc(m.name)}"/></label>
      <label class="field mb12"><span>PIN (необов'язково)</span><input class="input" id="mm-pin" inputmode="numeric" value="${esc(m.pin||"")}" placeholder="4 цифри"/></label>
      <div class="field"><span>Права</span>
        <label class="chk"><input type="checkbox" id="mm-emp" ${p.employees?"checked":""}/> Вести працівників</label>
        <label class="chk"><input type="checkbox" id="mm-edit" ${p.editRecords?"checked":""}/> Редагувати/видаляти записи</label>
        <label class="chk"><input type="checkbox" id="mm-exp" ${p.export?"checked":""}/> Вивантаження в Excel</label>
      </div>
      <div class="row gap8 mt16 end"><button class="btn btn-ghost" data-action="modal-close">Скасувати</button><button class="btn btn-primary" data-action="mgr-save">Зберегти</button></div>
    </div></div></div>`;
}
function openFieldModal(id){
  const fl = id? M().fields.find(x=>x.id===id) : {id:"",label:"",type:"text",unit:"",options:[],scope:"all",showInTable:false,sumInReports:false};
  if(!fl) return; const isAll = fl.scope==="all";
  const deptChecks=M().departments.map(d=>`<label class="chk"><input type="checkbox" class="fld-dept-chk" data-id="${d.id}" ${(Array.isArray(fl.scope)&&fl.scope.includes(d.id))?"checked":""}/> ${esc(d.name)}</label>`).join("")||'<div class="muted small">Дільниць ще немає.</div>';
  $("modal-root").innerHTML=`<div class="modal-overlay" data-action="modal-bg"><div class="modal modal-wide">
    <div class="modal-head"><h3 class="modal-title">${id?"Змінити поле":"Нове поле"}</h3><button class="icon-btn" data-action="modal-close">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="fld-id" value="${esc(fl.id)}"/>
      <div class="form-grid">
        <label class="field full"><span>Назва поля</span><input class="input" id="fld-label" value="${esc(fl.label)}" placeholder="Напр.: Витрата матеріалу"/></label>
        <label class="field"><span>Тип</span><select class="select" id="fld-type"><option value="text" ${fl.type==="text"?"selected":""}>Текст</option><option value="number" ${fl.type==="number"?"selected":""}>Число</option><option value="measure" ${fl.type==="measure"?"selected":""}>Число + одиниця</option><option value="select" ${fl.type==="select"?"selected":""}>Список</option></select></label>
        <label class="field"><span>Одиниця (кг, м…)</span><input class="input" id="fld-unit" value="${esc(fl.unit||"")}"/></label>
        <label class="field full"><span>Варіанти / одиниці (через кому)</span><input class="input" id="fld-options" value="${esc((fl.options||[]).join(", "))}" placeholder="Список: варіанти. Число+одиниця: одиниці, напр. м, кг"/></label>
      </div>
      <div class="field mt12"><span>Показувати на дільницях</span>
        <label class="chk"><input type="checkbox" id="fld-all" ${isAll?"checked":""}/> Усі дільниці</label>
        <div class="chk-list" id="fld-depts">${deptChecks}</div>
      </div>
      <div class="mt12">
        <label class="chk"><input type="checkbox" id="fld-table" ${fl.showInTable?"checked":""}/> Показувати колонкою в журналі</label>
        <label class="chk"><input type="checkbox" id="fld-sum" ${fl.sumInReports?"checked":""}/> Підсумовувати у зведенні (для чисел)</label>
      </div>
      <div class="row gap8 mt16 end"><button class="btn btn-ghost" data-action="modal-close">Скасувати</button><button class="btn btn-primary" data-action="field-save">Зберегти</button></div>
    </div></div></div>`;
}

document.addEventListener("click", async (e)=>{
  const t=e.target.closest("[data-action]"); if(!t) return;
  const a=t.dataset.action;

  if(a==="theme"){ state.theme = state.theme==="dark"?"light":"dark"; try{localStorage.setItem("uchet_theme",state.theme);}catch(e){} applyTheme(); render(); return; }

  if(a==="setup-admin"){ const name=($("su-name").value||"").trim(); const pin=($("su-pin").value||"").replace(/\D/g,"").slice(0,4); saveMeta(m=>{ m.admin={name:name||"Керуючий",pin,setup:true}; }); return; }
  if(a==="admin-save"){ const name=($("adm-name").value||"").trim(); const pin=($("adm-pin").value||"").replace(/\D/g,"").slice(0,4); saveMeta(m=>{ m.admin.name=name||"Керуючий"; m.admin.pin=pin; m.admin.setup=true; }); toast("ok","Кабінет керуючого збережено"); return; }
  if(a==="me-save"){ const id=state.session&&state.session.managerId; const name=($("me-name").value||"").trim(); const pin=($("me-pin").value||"").replace(/\D/g,"").slice(0,4); saveMeta(m=>{ const mg=m.managers.find(x=>x.id===id); if(mg){ if(name)mg.name=name; mg.pin=pin; } }); toast("ok","Збережено"); return; }
  if(a==="toggle-pins"){ state.showPins=!state.showPins; render(); return; }

  if(a==="pick"){
    const role=t.dataset.role, id=t.dataset.id||"";
    const same=state.loginPick && state.loginPick.role===role && (role==="admin"||state.loginPick.managerId===id);
    state.loginPick={ role, managerId: role==="manager"?id:undefined };
    if(same) doLogin(); else render();
    return;
  }
  if(a==="login-go"){ doLogin(); return; }
  if(a==="pin-ok"){ const v=($("pin-val").value||"").replace(/\D/g,""); if(v===pinCtx.pin){ closeModal(); pinCtx.cb(); } else { $("pin-err").textContent="Невірний PIN-код"; } return; }
  if(a==="logout"){ setSession(null); return; }
  if(a==="tab"){ state.view=t.dataset.view; render(); return; }
  if(a==="month"){ state.month=shiftMonth(state.month, parseInt(t.dataset.d,10)); render(); return; }
  if(a==="month-now"){ state.month=currentMonth(); render(); return; }
  if(a==="week"){ state.weekStart=addDays(state.weekStart, parseInt(t.dataset.d,10)); render(); return; }
  if(a==="week-now"){ state.weekStart=startOfWeek(new Date()); render(); return; }

  if(a==="modal-close"||a==="modal-bg"){ if(a==="modal-bg"&&e.target!==t)return; closeModal(); return; }

  if(a==="rec-new"){ openRecordModal(null); return; }
  if(a==="board-add"){ openRecordModal(null,{date:state.boardDate,departmentId:state.boardDept,employeeId:t.dataset.emp}); return; }
  if(a==="board-prev"){ state.boardDate=shiftDay(state.boardDate,-1); render(); return; }
  if(a==="board-next"){ state.boardDate=shiftDay(state.boardDate,1); render(); return; }
  if(a==="board-date"){ state.boardDate=t.value||todayStr(); render(); return; }
  if(a==="board-dept"){ state.boardDept=t.value; render(); return; }
  if(a==="rec-edit"){ const r=state.records.find(x=>x.id===t.dataset.id); if(r)openRecordModal(r); return; }
  if(a==="rec-del"){ removeRecord(t.dataset.id); return; }
  if(a==="rc-save"){
    const dep=$("rc-dept").value;
    const custom={}; fieldsFor(dep).forEach(fl=>{ const el=$("rc-cf-"+fl.id); if(el){ custom[fl.id]= (fl.type==="number"||fl.type==="measure")? num(el.value): el.value; if(fl.type==="measure"){ const us=$("rc-cfu-"+fl.id); if(us) custom[fl.id+"__u"]=us.value; } } });
    const rec={ date:$("rc-date").value, departmentId:dep, employeeId:$("rc-emp").value, orderNo:($("rc-order").value||"").trim(), product:($("rc-product").value||"").trim(), task:($("rc-task").value||"").trim(), qty:num($("rc-qty").value), minutesPerUnit:num($("rc-min").value), note:($("rc-note").value||"").trim(), custom };
    if(!rec.departmentId||!rec.employeeId||!rec.task){ toast("error","Заповніть дільницю, працівника та назву деталі"); return; }
    const id=$("rc-id").value; if(id) await editRecord(id,rec); else await addRecord(rec);
    closeModal(); toast("ok", id?"Запис змінено":"Запис додано"); return;
  }

  if(a==="emp-add"){ const fio=($("emp-fio").value||"").trim(); const dep=$("emp-dept").value; if(!fio||!dep){ toast("error","Введіть ПІБ та оберіть дільницю"); return; } saveMeta(m=>m.employees.push({id:uid(),fio,departmentId:dep})); toast("ok","Працівника додано"); return; }
  if(a==="emp-edit"){ const emp=M().employees.find(x=>x.id===t.dataset.id); if(!emp)return; const v=prompt("ПІБ працівника:", emp.fio); if(v&&v.trim()) saveMeta(m=>{const x=m.employees.find(y=>y.id===emp.id); if(x)x.fio=v.trim();}); return; }
  if(a==="emp-del"){ saveMeta(m=>{ m.employees=m.employees.filter(x=>x.id!==t.dataset.id); }); return; }

  if(a==="dept-add"){ const name=($("dept-name").value||"").trim(); const mgr=$("dept-mgr").value; if(!name){ toast("error","Введіть назву дільниці"); return; } saveMeta(m=>m.departments.push({id:uid(),name,managerIds:mgr?[mgr]:[]})); toast("ok","Дільницю додано"); return; }
  if(a==="dept-edit"){ openDeptModal(t.dataset.id); return; }
  if(a==="dept-del"){ if(confirm("Видалити дільницю? Записи та працівники залишаться в базі, але будуть приховані.")) saveMeta(m=>{ m.departments=m.departments.filter(x=>x.id!==t.dataset.id); }); return; }

  if(a==="mgr-add"){ const name=($("mgr-name").value||"").trim(); const pin=($("mgr-pin").value||"").replace(/\D/g,"").slice(0,4); if(!name){ toast("error","Введіть ім'я керівника"); return; } saveMeta(m=>m.managers.push({id:uid(),name,pin,perms:{employees:true,editRecords:true,export:true}})); toast("ok","Керівника додано"); return; }
  if(a==="mgr-del"){ if(confirm("Видалити керівника?")) saveMeta(m=>{ m.managers=m.managers.filter(x=>x.id!==t.dataset.id); m.departments.forEach(d=>{ d.managerIds=(d.managerIds||[]).filter(x=>x!==t.dataset.id); }); }); return; }

  if(a==="dept-save"){ const id=$("dm-id").value; const name=($("dm-name").value||"").trim(); const ids=[...document.querySelectorAll(".dept-mgr-chk:checked")].map(x=>x.value); saveMeta(m=>{ const d=m.departments.find(x=>x.id===id); if(d){ if(name)d.name=name; d.managerIds=ids; } }); closeModal(); return; }
  if(a==="mgr-edit"){ openManagerModal(t.dataset.id); return; }
  if(a==="mgr-save"){ const id=$("mm-id").value; const name=($("mm-name").value||"").trim(); const pin=($("mm-pin").value||"").replace(/\D/g,"").slice(0,4); const perms={ employees:$("mm-emp").checked, editRecords:$("mm-edit").checked, export:$("mm-exp").checked }; saveMeta(m=>{ const mg=m.managers.find(x=>x.id===id); if(mg){ if(name)mg.name=name; mg.pin=pin; mg.perms=perms; } }); closeModal(); return; }
  if(a==="order-add"){ const number=($("order-num").value||"").trim(); const product=($("order-prod").value||"").trim(); if(!number){ toast("error","Введіть номер замовлення"); return; } saveMeta(m=>m.orders.push({id:uid(),number,product})); toast("ok","Замовлення додано"); return; }
  if(a==="order-edit"){ const o=M().orders.find(x=>x.id===t.dataset.id); if(!o)return; const number=prompt("Номер замовлення:",o.number); if(number===null)return; const product=prompt("Назва виробу:",o.product||""); saveMeta(m=>{ const x=m.orders.find(y=>y.id===o.id); if(x){ x.number=(number||"").trim()||x.number; x.product=(product||"").trim(); } }); return; }
  if(a==="order-del"){ if(confirm("Видалити замовлення?")) saveMeta(m=>{ m.orders=m.orders.filter(x=>x.id!==t.dataset.id); }); return; }
  if(a==="field-new"){ openFieldModal(""); return; }
  if(a==="field-edit"){ openFieldModal(t.dataset.id); return; }
  if(a==="field-del"){ if(confirm("Видалити поле? Значення в наявних записах залишаться в базі.")) saveMeta(m=>{ m.fields=m.fields.filter(x=>x.id!==t.dataset.id); }); return; }
  if(a==="field-save"){
    const id=$("fld-id").value; const label=($("fld-label").value||"").trim(); if(!label){ toast("error","Введіть назву поля"); return; }
    const type=$("fld-type").value; const unit=($("fld-unit").value||"").trim();
    const options=(type==="select"||type==="measure")?($("fld-options").value||"").split(",").map(x=>x.trim()).filter(Boolean):[];
    const all=$("fld-all").checked; let scope="all"; if(!all){ scope=[...document.querySelectorAll(".fld-dept-chk:checked")].map(x=>x.dataset.id); }
    const showInTable=$("fld-table").checked; const sumInReports=type==="number"&&$("fld-sum").checked;
    saveMeta(m=>{ if(id){ const x=m.fields.find(y=>y.id===id); if(x){ x.label=label;x.type=type;x.unit=unit;x.options=options;x.scope=scope;x.showInTable=showInTable;x.sumInReports=sumInReports; } } else { m.fields.push({id:uid(),label,type,unit,options,scope,showInTable,sumInReports}); } });
    closeModal(); toast("ok","Поле збережено"); return;
  }

  if(a==="note-add"){ const text=($("note-text").value||"").trim(); if(!text)return; const ownerId=isAdmin()?"admin":state.session.managerId; saveMeta(m=>m.notes.push({id:uid(),ownerId,text,createdAt:new Date().toISOString()})); return; }
  if(a==="note-del"){ saveMeta(m=>{ m.notes=m.notes.filter(x=>x.id!==t.dataset.id); }); return; }

  if(a==="draw-open"){ openDrawing(t.dataset.id); return; }
  if(a==="draw-del"){ if(confirm("Видалити креслення?")) await deleteDrawing(t.dataset.id); return; }
  if(a==="draw-accept"){ const id=t.dataset.id; saveMeta(m=>{ const d=m.drawings.find(x=>x.id===id); if(d) d.status="in_work"; }); toast("ok","Прийнято в роботу"); return; }
  if(a==="draw-pass"){ const id=t.dataset.id; const sel=$("pass-"+id); const to=sel?sel.value:""; if(!to){ toast("error","Оберіть наступну дільницю"); return; } saveMeta(m=>{ const d=m.drawings.find(x=>x.id===id); if(d){ d.currentDept=to; d.status="waiting"; d.history=d.history||[]; d.history.push({deptId:to,at:todayStr()}); } }); toast("ok","Передано далі"); return; }
  if(a==="draw-finish"){ const id=t.dataset.id; if(!confirm("Завершити маршрут цього креслення?"))return; saveMeta(m=>{ const d=m.drawings.find(x=>x.id===id); if(d) d.finished=true; }); toast("ok","Маршрут завершено"); return; }

  if(a==="export-xlsx"){ exportXlsx(); return; }
});

// change для селектов/файла
document.addEventListener("change", async (e)=>{
  const t=e.target.closest("[data-action]"); if(!t) return;
  const a=t.dataset.action;
  if(a==="f-dept"){ state.filterDept=t.value; state.filterEmp="all"; render(); return; }
  if(a==="f-emp"){ state.filterEmp=t.value; render(); return; }
  if(a==="rc-dept"){ const dep=t.value; const sel=$("rc-emp"); if(sel){ sel.innerHTML = `<option value="">${dep?"— оберіть —":"спочатку дільниця"}</option>` + M().employees.filter(x=>x.departmentId===dep).map(x=>`<option value="${x.id}">${esc(x.fio)}</option>`).join(""); } const cc=$("rc-custom"); if(cc) cc.innerHTML=customFieldsHTML(dep,null); const tot=$("rc-total"); if(tot) tot.textContent=fmtMinutes(num($("rc-qty").value)*num($("rc-min").value)); return; }
  if(a==="feat-toggle"){ const k=t.dataset.key; const val=t.checked; saveMeta(m=>{ m.settings=m.settings||{}; m.settings.features=m.settings.features||{}; m.settings.features[k]=val; }); return; }
  if(a==="draw-file"){ handleDrawFile(t.files&&t.files[0]); return; }
});
// поиск и пересчёт (input)
document.addEventListener("input",(e)=>{
  const t=e.target.closest("[data-action]"); if(!t)return;
  if(t.dataset.action==="f-search"){ state.search=t.value; render(); }
  if(t.dataset.action==="rc-calc"){ const cutEl=$("rc-cf-cut"); const cut=cutEl?num(cutEl.value):0; const q=num($("rc-qty").value); const tot=$("rc-total"); if(tot) tot.textContent=fmtMinutes(q*(num($("rc-min").value)+cut)); const dEl=$("rc-cf-defect"); const d=dEl?num(dEl.value):0; const dr=$("rc-defrate"); if(dr) dr.textContent=d+" шт · "+((q+d)>0?(d/(q+d)*100).toFixed(1):"0.0")+"%"; }
  if(t.dataset.action==="rc-order"){ const o=(M().orders||[]).find(x=>String(x.number)===t.value); if(o){ const p=$("rc-product"); if(p) p.value=o.product||""; } }
});

// ---------- ПИН модалка ----------
let pinCtx={pin:"",cb:()=>{}};
function promptPin(name,pin,cb){
  pinCtx={pin,cb};
  $("modal-root").innerHTML=`<div class="modal-overlay" data-action="modal-bg"><div class="modal">
    <div class="modal-head"><h3 class="modal-title">Вхід: ${esc(name)}</h3><button class="icon-btn" data-action="modal-close">✕</button></div>
    <div class="modal-body"><input class="input pin-input" id="pin-val" inputmode="numeric" maxlength="4" placeholder="PIN" autofocus />
    <div class="err-text" id="pin-err"></div>
    <div class="row gap8 mt12"><button class="btn btn-ghost" data-action="modal-close">Скасувати</button><button class="btn btn-primary grow" data-action="pin-ok">Увійти</button></div></div></div></div>`;
  setTimeout(()=>{ const el=$("pin-val"); if(el){ el.focus(); el.addEventListener("keydown",(ev)=>{ if(ev.key==="Enter"){ const v=el.value.replace(/\D/g,""); if(v===pinCtx.pin){ closeModal(); pinCtx.cb(); } else $("pin-err").textContent="Невірний PIN-код"; } }); } },50);
}

// ---------- чертежи: файл ----------
async function storeDrawing(id,dataUrl){ if(mode==="cloud") await fb.setDoc(fb.doc(db,"drawings",id),{data:dataUrl}); else { if(LS_OK) localStorage.setItem(LS_DRAW(id),dataUrl); } }
async function fetchDrawing(id){ if(mode==="cloud"){ const sp=await fb.getDoc(fb.doc(db,"drawings",id)); return sp.exists()?sp.data().data:null; } return localStorage.getItem(LS_DRAW(id)); }
async function deleteDrawingData(id){ if(mode==="cloud") await fb.deleteDoc(fb.doc(db,"drawings",id)); else localStorage.removeItem(LS_DRAW(id)); }
function readFileDataUrl(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onerror=()=>reject(new Error("read")); r.onload=()=>resolve(r.result); r.readAsDataURL(file); }); }
async function handleDrawFile(file){
  if(!file) return;
  const name=($("draw-name").value||"").trim();
  if(!name){ toast("error","Спочатку введіть назву креслення"); const fi=$("draw-file"); if(fi)fi.value=""; return; }
  const target=$("draw-target").value;
  if(!target){ toast("error","Оберіть стартову дільницю"); const fi=$("draw-file"); if(fi)fi.value=""; return; }
  const btn=$("draw-btn"); if(btn){ btn.textContent="Завантаження…"; btn.classList.add("disabled"); }
  try{
    const isImage=(file.type||"").startsWith("image/");
    const dataUrl = isImage ? await compressImage(file) : await readFileDataUrl(file);
    if(dataUrl.length>900000){ toast("error", isImage?"Зображення завелике. Візьміть менше.":"Файл завеликий для хмари (ліміт ~0.9 МБ). Стисніть або запакуйте меншим архівом."); return; }
    const id=uid();
    await storeDrawing(id, dataUrl);
    await saveMeta(m=>m.drawings.push({ id, name, fileName:file.name||name, mime:file.type||"", isImage, currentDept:target, status:"waiting", finished:false, history:[{deptId:target,at:todayStr()}], createdAt:todayStr() }));
    toast("ok","Креслення завантажено");
  }catch(err){ toast("error","Не вдалося завантажити файл."); }
  finally{ const b=$("draw-btn"); if(b){ b.textContent="Обрати файл"; b.classList.remove("disabled"); } const fi=$("draw-file"); if(fi)fi.value=""; }
}
async function openDrawing(id){
  const meta=M().drawings.find(d=>d.id===id); if(!meta)return;
  try{
    const src=await fetchDrawing(id);
    if(!src){ toast("error","Файл не знайдено"); return; }
    const isImg = meta.isImage || /^data:image\//.test(src);
    if(isImg){
      $("modal-root").innerHTML=`<div class="modal-overlay" data-action="modal-bg"><div class="modal modal-wide">
        <div class="modal-head"><h3 class="modal-title">${esc(meta.name)}</h3><button class="icon-btn" data-action="modal-close">✕</button></div>
        <div class="modal-body"><img class="draw-full" src="${src}" alt="${esc(meta.name)}" /><div class="row end mt12"><a class="btn btn-ghost" href="${src}" download="${esc(meta.fileName||(meta.name+".jpg"))}">Завантажити</a></div></div></div></div>`;
    } else {
      const a=document.createElement("a"); a.href=src; a.download=meta.fileName||meta.name; document.body.appendChild(a); a.click(); a.remove();
      toast("ok","Завантаження файлу…");
    }
  }catch(e){ toast("error","Не вдалося відкрити файл"); }
}
async function deleteDrawing(id){ try{ await deleteDrawingData(id); }catch(e){} await saveMeta(m=>{ m.drawings=m.drawings.filter(x=>x.id!==id); }); }

// ---------- Excel ----------
function exportXlsx(){
  const vis=visibleDeptIdSet();
  const recs=state.records.filter(r=>vis.has(r.departmentId)&&monthOf(r.date)===state.month).sort((a,b)=>a.date<b.date?-1:1);
  if(recs.length===0){ toast("error","За цей місяць немає даних для вивантаження"); return; }
  try{
    const flds=M().fields||[];
    const rows=recs.map(r=>{
      const row={ "Дата":r.date,"Дільниця":deptName(r.departmentId),"Працівник (ПІБ)":empName(r.employeeId),"Замовлення №":r.orderNo||"","Виріб":r.product||"","Деталь / заготовка":r.task,"Кількість":num(r.qty),"Час виготовлення/шт (хв)":num(r.minutesPerUnit),"Разом час (хв)":recTotalMin(r) };
      flds.forEach(fl=>{ const v=(r.custom||{})[fl.id]; if(fl.type==="measure"){ const u=(r.custom||{})[fl.id+"__u"]||((fl.options||[])[0]||""); row[fl.label] = (v===undefined||v==="")?"":(num(v)+" "+u); } else { row[fl.label+(fl.unit?` (${fl.unit})`:"")] = fl.type==="number"?num(v||0):(v||""); } });
      row["Нотатка"]=r.note||"";
      return row;
    });
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.json_to_sheet(rows);
    ws["!cols"]=Object.keys(rows[0]||{}).map(()=>({wch:16}));
    XLSX.utils.book_append_sheet(wb,ws,"Журнал");
    const sumFields=flds.filter(fl=>fl.sumInReports);
    const agg={}; recs.forEach(r=>{ const k=r.employeeId; const a=agg[k]=agg[k]||{fio:empName(k),dept:deptName(r.departmentId),qty:0,min:0,extra:{}}; a.qty+=num(r.qty); a.min+=recTotalMin(r); sumFields.forEach(fl=>{ a.extra[fl.id]=(a.extra[fl.id]||0)+num((r.custom||{})[fl.id]||0); }); });
    const sumRows=Object.values(agg).map(a=>{ const o={ "Працівник (ПІБ)":a.fio,"Дільниця":a.dept,"Всього деталей / заготовок":a.qty,"Всього часу (хв)":a.min,"Всього часу (год)":Math.round(a.min/60*10)/10 }; sumFields.forEach(fl=>{ o["Всього: "+fl.label+(fl.unit?` (${fl.unit})`:"")]=a.extra[fl.id]||0; }); return o; });
    const ws2=XLSX.utils.json_to_sheet(sumRows);
    ws2["!cols"]=Object.keys(sumRows[0]||{}).map(()=>({wch:20}));
    XLSX.utils.book_append_sheet(wb,ws2,"Зведення");
    XLSX.writeFile(wb,`Oblik_robit_${state.month}.xlsx`);
    toast("ok","Файл Excel сформовано");
  }catch(e){ toast("error","Не вдалося сформувати файл"); }
}

// ---------- тост ----------
function toast(type,msg){
  const root=$("toast-root");
  root.innerHTML=`<div class="toast ${type==="error"?"toast-error":"toast-ok"}">${esc(msg)}</div>`;
  setTimeout(()=>{ root.innerHTML=""; },3000);
}

// ---------- старт ----------
function nowStr(){ try{ return new Date().toLocaleString("uk-UA",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",second:"2-digit"}); }catch(e){ return new Date().toLocaleString(); } }
function startClock(){ setInterval(()=>{ const el=document.getElementById("topclock"); if(el) el.textContent=nowStr(); },1000); }
if(state.configured) startFirebase(); else startLocal();
startClock();
